services:
  backend:
    build:
      context: ./backend
    environment:
      - SECRET_KEY=${SECRET_KEY:-change-me-in-production}
      - DJANGO_SETTINGS_MODULE=core.settings
      - BACKSTAB_DATA_DIR=/data
    volumes:
      - backstab_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8000), timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  frontend:
    build:
      context: ./front-end
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  backstab_data:
